<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Opala 98 — Teste de Velocidade</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #87ceeb; font-family: system-ui, -apple-system, sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }

    #canvas { display: block; width: 100%; height: 100%; }

    .hud {
      position: fixed; top: 12px; left: 12px; z-index: 20;
      background: rgba(0,0,0,0.6); border: 2px solid #ffd700; border-radius: 10px;
      padding: 12px 16px; color: white; font-size: 13px; min-width: 140px;
      font-weight: bold; font-family: monospace;
    }

    .hud-item { margin: 6px 0; display: flex; justify-content: space-between; gap: 10px; }
    .label { color: #aaa; }
    .value { color: #ffd700; font-size: 16px; }

    .controls-mobile {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      z-index: 30; display: none; flex-direction: column; align-items: center; gap: 10px;
    }

    .dpad {
      display: grid; grid-template-columns: 60px 60px 60px; grid-gap: 4px;
      width: fit-content;
    }

    .dpad-btn {
      width: 60px; height: 60px; background: rgba(100,150,200,0.7); border: 2px solid #fff;
      border-radius: 8px; color: white; font-size: 24px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none; touch-action: none;
      cursor: pointer; transition: background 0.1s;
    }

    .dpad-btn:active { background: rgba(100,150,200,0.95); }
    .dpad-empty { grid-column: 2; }

    .action-buttons {
      display: flex; gap: 10px; justify-content: center;
    }

    .action-btn {
      width: 70px; height: 70px; border-radius: 50%; font-weight: bold;
      border: 2px solid #fff; color: white; font-size: 12px; display: flex;
      align-items: center; justify-content: center; touch-action: none;
      transition: background 0.1s;
    }

    #motorBtn { background: rgba(200,100,100,0.7); }
    #motorBtn:active { background: rgba(200,100,100,0.95); }

    #freioBtn { background: rgba(100,100,200,0.7); }
    #freioBtn:active { background: rgba(100,100,200,0.95); }

    #turboBtn { background: rgba(200,200,100,0.7); }
    #turboBtn:active { background: rgba(200,200,100,0.95); }

    @media (max-width: 768px) {
      .controls-mobile { display: flex; }
      .hud { font-size: 11px; padding: 10px 12px; min-width: 120px; }
      .hud-item { margin: 4px 0; }
      .value { font-size: 14px; }
    }

    .info {
      position: fixed; bottom: 12px; left: 12px; z-index: 20;
      background: rgba(0,0,0,0.6); border: 1px solid #888; border-radius: 8px;
      padding: 8px 12px; color: #aaa; font-size: 11px; max-width: 200px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="hud">
    <div class="hud-item"><span class="label">Velocidade:</span><span class="value" id="speed">0 km/h</span></div>
    <div class="hud-item"><span class="label">Marcha:</span><span class="value" id="gear">N</span></div>
    <div class="hud-item"><span class="label">Motor:</span><span class="value" id="status">OFF</span></div>
    <div class="hud-item"><span class="label">Distância:</span><span class="value" id="distance">0 m</span></div>
  </div>

  <div class="info">
    🎮 Toque nos botões para dirigir<br>
    Pressione MOTOR, depois use setas para andar
  </div>

  <div class="controls-mobile">
    <div class="dpad">
      <div></div>
      <button class="dpad-btn" id="upBtn">▲</button>
      <div></div>
      <button class="dpad-btn" id="leftBtn">◀</button>
      <div class="dpad-empty"></div>
      <button class="dpad-btn" id="rightBtn">▶</button>
      <div></div>
      <button class="dpad-btn" id="downBtn">▼</button>
      <div></div>
    </div>
    <div class="action-buttons">
      <button class="action-btn" id="motorBtn">MOTOR</button>
      <button class="action-btn" id="freioBtn">FREIO</button>
      <button class="action-btn" id="turboBtn">TURBO</button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 80, 200);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 8);
    camera.lookAt(0, 0.5, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    // Iluminação
    scene.add(new THREE.HemisphereLight(0xe6f3ff, 0x5a7a4a, 1.8));
    const sun = new THREE.DirectionalLight(0xffedd5, 2.0);
    sun.position.set(25, 20, 15);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -50;
    sun.shadow.camera.right = 50;
    sun.shadow.camera.top = 50;
    sun.shadow.camera.bottom = -50;
    sun.shadow.camera.far = 100;
    scene.add(sun);

    // Céu
    const skyDome = new THREE.Mesh(
      new THREE.SphereGeometry(150, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0x87ceeb, side: THREE.BackSide })
    );
    scene.add(skyDome);

    // Terreno
    const groundGeo = new THREE.PlaneGeometry(200, 200);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x6ba346, roughness: 1 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    ground.position.y = -0.02;
    scene.add(ground);

    // Textura de grama
    const grassCanvas = document.createElement('canvas');
    grassCanvas.width = 256;
    grassCanvas.height = 256;
    const grassCtx = grassCanvas.getContext('2d');
    grassCtx.fillStyle = '#6ba346';
    grassCtx.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 3000; i++) {
      const x = Math.random() * 256;
      const y = Math.random() * 256;
      grassCtx.fillStyle = ['#5a9236', '#7bb855', '#4a8226'][Math.random() * 3 | 0];
      grassCtx.globalAlpha = 0.3 + Math.random() * 0.3;
      grassCtx.fillRect(x, y, 1 + Math.random() * 2, 1 + Math.random() * 2);
    }
    grassCtx.globalAlpha = 1;
    const grassTex = new THREE.CanvasTexture(grassCanvas);
    grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
    grassTex.repeat.set(12, 12);
    groundMat.map = grassTex;
    groundMat.needsUpdate = true;

    // Cercado de árvores ao redor
    function criarArvore(x, z, escala = 1) {
      const troco = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3, 0.4, 4, 8),
        new THREE.MeshStandardMaterial({ color: 0x5a3a1a, roughness: 1 })
      );
      troco.position.y = 2;
      troco.castShadow = true;

      const copa = new THREE.Mesh(
        new THREE.ConeGeometry(2.2 * escala, 5 * escala, 12),
        new THREE.MeshStandardMaterial({ color: 0x2a5a2a, roughness: 0.95 })
      );
      copa.position.y = 5.5 * escala;
      copa.castShadow = true;

      const grupo = new THREE.Group();
      grupo.add(troco, copa);
      grupo.position.set(x, 0, z);
      grupo.scale.set(escala, escala, escala);
      scene.add(grupo);
    }

    // Cercado de árvores em volta do mapa
    const rays = 32;
    const radius = 92;
    for (let i = 0; i < rays; i++) {
      const angle = (i / rays) * Math.PI * 2;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      criarArvore(x, z, 0.8 + Math.random() * 0.4);
    }

    // Opala 98 - Modelo detalhado
    const carGroup = new THREE.Group();
    carGroup.position.set(0, 0, 0);
    scene.add(carGroup);

    // Material do corpo
    const pinturaMat = new THREE.MeshPhysicalMaterial({
      color: 0xa31f2a,
      metalness: 0.6,
      roughness: 0.2,
      clearcoat: 1,
      clearcoatRoughness: 0.15
    });

    const chromeMat = new THREE.MeshStandardMaterial({
      color: 0xd8dfe5,
      metalness: 0.95,
      roughness: 0.15
    });

    const vidroMat = new THREE.MeshStandardMaterial({
      color: 0x1a2a3a,
      metalness: 0.3,
      roughness: 0.1,
      transparent: true,
      opacity: 0.8
    });

    const borracha = new THREE.MeshStandardMaterial({
      color: 0x1a1a1a,
      roughness: 0.9
    });

    const preto = new THREE.MeshStandardMaterial({
      color: 0x0a0a0a,
      roughness: 0.8
    });

    const interiorMat = new THREE.MeshStandardMaterial({
      color: 0x3a2a1a,
      roughness: 0.8
    });

    // Chassis e carroceria
    const chassis = new THREE.Mesh(
      new THREE.BoxGeometry(2.0, 0.5, 4.5),
      pinturaMat
    );
    chassis.position.y = 0.8;
    chassis.castShadow = true;
    chassis.receiveShadow = true;
    carGroup.add(chassis);

    // Teto
    const teto = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 0.15, 1.8),
      pinturaMat
    );
    teto.position.y = 1.88;
    teto.position.z = -0.1;
    teto.castShadow = true;
    carGroup.add(teto);

    // Capô
    const cao = new THREE.Mesh(
      new THREE.BoxGeometry(1.85, 0.08, 1.0),
      pinturaMat
    );
    cao.position.y = 1.15;
    cao.position.z = -1.7;
    cao.castShadow = true;
    carGroup.add(cao);

    // Porta-malas
    const portaMalas = new THREE.Mesh(
      new THREE.BoxGeometry(1.85, 0.08, 0.9),
      pinturaMat
    );
    portaMalas.position.y = 1.15;
    portaMalas.position.z = 1.75;
    portaMalas.castShadow = true;
    carGroup.add(portaMalas);

    // Lateral (com vidros)
    for (const lado of [-1, 1]) {
      // Vidro dianteiro
      const vidroDiant = new THREE.Mesh(
        new THREE.BoxGeometry(0.04, 0.35, 0.6),
        vidroMat
      );
      vidroDiant.position.set(lado * 0.92, 1.5, -0.7);
      vidroDiant.castShadow = false;
      carGroup.add(vidroDiant);

      // Vidro traseiro
      const vidroTras = new THREE.Mesh(
        new THREE.BoxGeometry(0.04, 0.35, 0.6),
        vidroMat
      );
      vidroTras.position.set(lado * 0.92, 1.5, 0.7);
      vidroTras.castShadow = false;
      carGroup.add(vidroTras);

      // Cromados laterais
      const cromado = new THREE.Mesh(
        new THREE.BoxGeometry(0.08, 0.03, 4.2),
        chromeMat
      );
      cromado.position.set(lado * 0.98, 0.54, 0);
      carGroup.add(cromado);
    }

    // Para-choque dianteiro
    const paraChoqueDiant = new THREE.Mesh(
      new THREE.BoxGeometry(2.05, 0.15, 0.15),
      chromeMat
    );
    paraChoqueDiant.position.y = 0.65;
    paraChoqueDiant.position.z = -2.3;
    paraChoqueDiant.castShadow = true;
    carGroup.add(paraChoqueDiant);

    // Para-choque traseiro
    const paraChoqueTras = new THREE.Mesh(
      new THREE.BoxGeometry(2.05, 0.15, 0.15),
      chromeMat
    );
    paraChoqueTras.position.y = 0.65;
    paraChoqueTras.position.z = 2.3;
    paraChoqueTras.castShadow = true;
    carGroup.add(paraChoqueTras);

    // Farol dianteiro esquerdo
    const farolEsq = new THREE.Mesh(
      new THREE.CylinderGeometry(0.15, 0.15, 0.1, 20),
      new THREE.MeshStandardMaterial({ color: 0xfff8dc, emissive: 0xffff99, emissiveIntensity: 0.4 })
    );
    farolEsq.rotation.z = Math.PI / 2;
    farolEsq.position.set(-0.65, 1.0, -2.25);
    carGroup.add(farolEsq);

    // Farol dianteiro direito
    const farolDir = new THREE.Mesh(
      new THREE.CylinderGeometry(0.15, 0.15, 0.1, 20),
      new THREE.MeshStandardMaterial({ color: 0xfff8dc, emissive: 0xffff99, emissiveIntensity: 0.4 })
    );
    farolDir.rotation.z = Math.PI / 2;
    farolDir.position.set(0.65, 1.0, -2.25);
    carGroup.add(farolDir);

    // Lanternas traseiras
    const lanterna1 = new THREE.Mesh(
      new THREE.BoxGeometry(0.2, 0.15, 0.08),
      new THREE.MeshStandardMaterial({ color: 0xcc0000, emissive: 0x660000, emissiveIntensity: 0.3 })
    );
    lanterna1.position.set(-0.7, 0.9, 2.3);
    carGroup.add(lanterna1);

    const lanterna2 = new THREE.Mesh(
      new THREE.BoxGeometry(0.2, 0.15, 0.08),
      new THREE.MeshStandardMaterial({ color: 0xcc0000, emissive: 0x660000, emissiveIntensity: 0.3 })
    );
    lanterna2.position.set(0.7, 0.9, 2.3);
    carGroup.add(lanterna2);

    // Interior visível (banco)
    const banco = new THREE.Mesh(
      new THREE.BoxGeometry(1.3, 0.15, 0.6),
      interiorMat
    );
    banco.position.y = 1.2;
    banco.position.z = -0.1;
    carGroup.add(banco);

    // Volante (simples)
    const volante = new THREE.Mesh(
      new THREE.TorusGeometry(0.15, 0.02, 8, 20),
      preto
    );
    volante.rotation.y = Math.PI / 2;
    volante.position.set(0, 1.55, -0.35);
    carGroup.add(volante);

    // Rodas - Array para referência
    const rodas = [];

    function criarRoda(x, z) {
      const grupoRoda = new THREE.Group();
      grupoRoda.position.set(x, 0.45, z);

      // Pneu
      const pneu = new THREE.Mesh(
        new THREE.CylinderGeometry(0.48, 0.48, 0.24, 20),
        borracha
      );
      pneu.rotation.z = Math.PI / 2;
      pneu.castShadow = true;
      grupoRoda.add(pneu);

      // Roda cromada
      const roda = new THREE.Mesh(
        new THREE.CylinderGeometry(0.32, 0.32, 0.25, 16),
        chromeMat
      );
      roda.rotation.z = Math.PI / 2;
      grupoRoda.add(roda);

      // Centro
      const centro = new THREE.Mesh(
        new THREE.CylinderGeometry(0.1, 0.1, 0.27, 16),
        chromeMat
      );
      centro.rotation.z = Math.PI / 2;
      grupoRoda.add(centro);

      // Parafusos
      for (let i = 0; i < 5; i++) {
        const parafuso = new THREE.Mesh(
          new THREE.SphereGeometry(0.02, 8, 8),
          chromeMat
        );
        const ang = (i / 5) * Math.PI * 2;
        parafuso.position.set(0.08 * Math.cos(ang), 0.17 * Math.sin(ang), 0.05);
        grupoRoda.add(parafuso);
      }

      carGroup.add(grupoRoda);
      rodas.push(grupoRoda);
    }

    // 4 rodas
    criarRoda(-0.95, -1.4);
    criarRoda(0.95, -1.4);
    criarRoda(-0.95, 1.4);
    criarRoda(0.95, 1.4);

    // Luz frontal
    const luz = new THREE.SpotLight(0xfff0b3, 40, 25, Math.PI / 12, 0.5, 1.2);
    luz.position.set(0, 1.0, -2.2);
    luz.target.position.set(0, 0.5, -15);
    carGroup.add(luz);
    carGroup.add(luz.target);

    // Controles de teclado
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (e.key.toLowerCase() === 'e') {
        state.motorLigado = !state.motorLigado;
        updateStatus();
      }
    });
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    // Controles móveis
    const state = {
      velocidade: 0,
      direcao: 0,
      motorLigado: false,
      distancia: 0,
      rotacao: 0
    };

    function setupMobileControls() {
      const upBtn = document.getElementById('upBtn');
      const downBtn = document.getElementById('downBtn');
      const leftBtn = document.getElementById('leftBtn');
      const rightBtn = document.getElementById('rightBtn');
      const motorBtn = document.getElementById('motorBtn');
      const freioBtn = document.getElementById('freioBtn');
      const turboBtn = document.getElementById('turboBtn');

      function addTouchControl(btn, action) {
        btn.addEventListener('pointerdown', (e) => { e.preventDefault(); keys[action] = true; });
        btn.addEventListener('pointerup', (e) => { e.preventDefault(); keys[action] = false; });
        btn.addEventListener('pointercancel', () => { keys[action] = false; });
      }

      addTouchControl(upBtn, 'w');
      addTouchControl(downBtn, 's');
      addTouchControl(leftBtn, 'a');
      addTouchControl(rightBtn, 'd');

      motorBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        state.motorLigado = !state.motorLigado;
        updateStatus();
      });

      freioBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); keys['freio'] = true; });
      freioBtn.addEventListener('pointerup', (e) => { e.preventDefault(); keys['freio'] = false; });
      freioBtn.addEventListener('pointercancel', () => { keys['freio'] = false; });

      turboBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); keys['turbo'] = true; });
      turboBtn.addEventListener('pointerup', (e) => { e.preventDefault(); keys['turbo'] = false; });
      turboBtn.addEventListener('pointercancel', () => { keys['turbo'] = false; });
    }

    setupMobileControls();

    function updateStatus() {
      document.getElementById('status').textContent = state.motorLigado ? 'ON' : 'OFF';
      document.getElementById('status').style.color = state.motorLigado ? '#00ff00' : '#ff6666';
    }

    let tempoAnterior = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      const dt = Math.min((now - tempoAnterior) / 1000, 0.05);
      tempoAnterior = now;

      // Física do carro
      const aceleracao = (keys['w'] || keys['arrowup']) ? 1 : 0;
      const freio = (keys['s'] || keys['arrowdown'] || keys['freio']) ? 1 : 0;
      const turbo = keys['turbo'] ? 2 : 1;
      const esquerda = (keys['a'] || keys['arrowleft']) ? -1 : 0;
      const direita = (keys['d'] || keys['arrowright']) ? 1 : 0;

      if (state.motorLigado) {
        state.velocidade += aceleracao * 35 * turbo * dt;
        state.velocidade -= freio * 45 * dt;
      } else {
        state.velocidade -= 15 * dt;
      }

      state.velocidade = Math.max(-15, Math.min(65, state.velocidade));

      if (Math.abs(state.velocidade) < 0.1) state.velocidade = 0;

      // Direção
      const direcaoForce = (esquerda + direita) * 2.0;
      state.direcao = Math.max(-1, Math.min(1, state.direcao + direcaoForce * dt));
      state.direcao *= 0.94;

      // Rotação do carro
      if (Math.abs(state.velocidade) > 0.5) {
        state.rotacao += state.direcao * state.velocidade * 0.025 * dt;
      }

      carGroup.rotation.y = state.rotacao;

      // Movimento
      const dx = Math.sin(state.rotacao) * state.velocidade * dt * 1.2;
      const dz = Math.cos(state.rotacao) * state.velocidade * dt * 1.2;
      carGroup.position.x += dx;
      carGroup.position.z += dz;

      // Limite do mapa
      const limiteXZ = 85;
      carGroup.position.x = Math.max(-limiteXZ, Math.min(limiteXZ, carGroup.position.x));
      carGroup.position.z = Math.max(-limiteXZ, Math.min(limiteXZ, carGroup.position.z));

      // Girar rodas
      if (Math.abs(state.velocidade) > 0.05) {
        rodas.forEach((roda) => {
          roda.rotation.x -= (state.velocidade * dt * 0.95);
        });
      }

      // Distância
      state.distancia += Math.abs(state.velocidade) * 6 * dt;

      // Câmera segue o carro
      const camDistance = 8;
      const camHeight = 3;
      const anguloCam = state.rotacao + Math.PI;
      const cameraTargetX = carGroup.position.x + Math.sin(anguloCam) * camDistance;
      const cameraTargetZ = carGroup.position.z + Math.cos(anguloCam) * camDistance;

      camera.position.x += (cameraTargetX - camera.position.x) * 0.1;
      camera.position.z += (cameraTargetZ - camera.position.z) * 0.1;
      camera.position.y = carGroup.position.y + camHeight;

      camera.lookAt(
        carGroup.position.x,
        carGroup.position.y + 1.0,
        carGroup.position.z
      );

      // Atualizar HUD
      const kmh = Math.round(Math.abs(state.velocidade) * 3.6);
      document.getElementById('speed').textContent = kmh + ' km/h';

      let marcha = 'N';
      if (state.velocidade > 0.5) {
        marcha = kmh < 15 ? '1' : kmh < 30 ? '2' : kmh < 45 ? '3' : kmh < 60 ? '4' : '5';
      } else if (state.velocidade < -0.5) {
        marcha = 'R';
      }
      document.getElementById('gear').textContent = marcha;

      document.getElementById('distance').textContent = Math.floor(state.distancia) + ' m';

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateStatus();
  </script>
</body>
</html>
